<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Plate Catch!</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0d2b; overflow: hidden; touch-action: none; }
    canvas { display: block; }
    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 14px 0;
      text-align: center;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(12px, 3.5vw, 22px);
      color: #fff;
      text-shadow: 3px 3px 0 #000;
      pointer-events: none;
      z-index: 10;
    }
    #score { color: #FFD700; }
    .hud-btn {
      position: fixed;
      top: 12px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.55);
      border: 2px solid rgba(255,255,255,0.55);
      border-radius: 6px;
      color: #fff;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      z-index: 20;
      padding: 0;
      transition: background 0.12s, border-color 0.12s;
    }
    .hud-btn:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.85);
    }
    #mute-btn     { right: 12px; }
    #settings-btn { right: 60px; }
    #home-btn     { right: 108px; text-decoration: none; }
    #settings-btn svg { display: block; }

    #settings-panel {
      display: none;
      position: fixed;
      top: 62px; right: 12px;
      background: rgba(8,8,36,0.97);
      border: 2px solid rgba(255,255,255,0.35);
      border-radius: 8px;
      padding: 18px 18px 14px;
      z-index: 30;
      font-family: 'Press Start 2P', monospace;
      color: #fff;
      width: 230px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    #settings-panel.open { display: block; }
    #settings-panel .section-label {
      font-size: 7px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 2px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    #settings-panel .row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #lives-slider {
      flex: 1;
      height: 4px;
      accent-color: #FF4757;
      cursor: pointer;
    }
    #lives-val {
      font-size: 16px;
      color: #FF4757;
      min-width: 20px;
      text-align: right;
      text-shadow: 0 0 8px rgba(255,71,87,0.5);
    }

    #game-over {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5,5,20,0.82);
      z-index: 40;
      align-items: center;
      justify-content: center;
      font-family: 'Press Start 2P', monospace;
      color: #fff;
      text-align: center;
    }
    #game-over.open { display: flex; }
    .over-box {
      background: rgba(8,8,36,0.97);
      border: 3px solid rgba(255,255,255,0.35);
      border-radius: 10px;
      padding: 32px 28px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      max-width: 320px;
    }
    .over-title {
      font-size: clamp(16px, 4vw, 24px);
      color: #FF6B6B;
      text-shadow: 3px 3px 0 #000;
      margin-bottom: 18px;
    }
    .over-score {
      font-size: clamp(9px, 2.2vw, 13px);
      color: #FFD700;
      margin-bottom: 26px;
      line-height: 1.9;
    }
    #restart-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(9px, 2vw, 12px);
      background: #FFD700;
      color: #1a1a2e;
      border: none;
      border-radius: 6px;
      padding: 14px 22px;
      cursor: pointer;
      box-shadow: 0 4px 0 #b8860b;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    #restart-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #b8860b;
    }
  </style>
</head>
<body>
  <div id="hud">&#x1F37D;&#xFE0F; CAUGHT: <span id="score">0</span></div>
  <button id="settings-btn" class="hud-btn" title="Settings">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="10" cy="10" r="3" stroke="white" stroke-width="2"/>
      <path d="M10 1v2M10 17v2M1 10h2M17 10h2M3.22 3.22l1.41 1.41M15.36 15.36l1.41 1.41M3.22 16.78l1.41-1.41M15.36 4.64l1.41-1.41" stroke="white" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
  <button id="mute-btn" class="hud-btn" title="Toggle sound (M)">&#x1F507;</button>
  <a id="home-btn" class="hud-btn" href="index.html" title="Home">&#x1F3E0;</a>
  <audio id="catch-sound" src="catch.mp3" preload="auto"></audio>

  <div id="settings-panel">
    <div class="section-label">Lives</div>
    <div class="row">
      <input id="lives-slider" type="range" min="1" max="10" value="5">
      <span id="lives-val">5</span>
    </div>
  </div>

  <div id="game-over">
    <div class="over-box">
      <div class="over-title">GAME OVER</div>
      <div class="over-score">PLATES CAUGHT:<br><span id="final-score">0</span></div>
      <button id="restart-btn">PLAY AGAIN</button>
    </div>
  </div>

  <canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const scoreEl = document.getElementById('score');

let W = 0, H = 0;

// ─── AUDIO ───────────────────────────────────────────────────────────────────
let muted     = false;
const catchSound = document.getElementById('catch-sound');

function setMute(m) {
  muted = m;
  catchSound.muted = muted;
  document.getElementById('mute-btn').textContent = muted ? '🔇' : '🔊';
}

function playCatch() {
  if (muted) return;
  catchSound.currentTime = 0;
  catchSound.play().catch(() => {});
}

let audioCtx;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTone(freq, duration, type = 'sine', vol = 0.3) {
  const ac = getAudio();
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.connect(gain); gain.connect(ac.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, ac.currentTime);
  gain.gain.setValueAtTime(vol, ac.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
  osc.start(ac.currentTime);
  osc.stop(ac.currentTime + duration);
}

// Shattering plate: a short burst of noise plus a few descending "clink" tones.
function playBreak() {
  if (muted) return;
  const ac  = getAudio();
  const t0  = ac.currentTime;
  const dur = 0.3;
  const size = Math.floor(ac.sampleRate * dur);
  const buffer = ac.createBuffer(1, size, ac.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < size; i++) data[i] = Math.random() * 2 - 1;
  const noise = ac.createBufferSource(); noise.buffer = buffer;
  const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1000;
  const ng = ac.createGain();
  ng.gain.setValueAtTime(0.3, t0);
  ng.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  noise.connect(hp); hp.connect(ng); ng.connect(ac.destination);
  noise.start(t0); noise.stop(t0 + dur);
  [1400, 1000, 750].forEach((f, i) => setTimeout(() => playTone(f, 0.12, 'triangle', 0.15), i * 35));
}

function playGameOver() {
  if (muted) return;
  [440, 392, 349, 294].forEach((f, i) => setTimeout(() => playTone(f, 0.35, 'triangle', 0.3), i * 180));
}

// Mute button + M key
document.getElementById('mute-btn').addEventListener('click', () => setMute(!muted));
document.addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') setMute(!muted);
});
setMute(muted); // sync button icon with default (sound on)

// ─── SETTINGS PANEL ──────────────────────────────────────────────────────────
const settingsPanel = document.getElementById('settings-panel');
const livesSlider    = document.getElementById('lives-slider');
const livesVal       = document.getElementById('lives-val');

let livesMax     = parseInt(localStorage.getItem('plate-lives'), 10) || 5;
let livesCurrent = livesMax;
livesSlider.value = livesMax;
livesVal.textContent = livesMax;

document.getElementById('settings-btn').addEventListener('click', e => {
  e.stopPropagation();
  settingsPanel.classList.toggle('open');
});
document.addEventListener('click', e => {
  if (!settingsPanel.contains(e.target)) settingsPanel.classList.remove('open');
});
livesSlider.addEventListener('input', () => {
  livesMax = parseInt(livesSlider.value, 10);
  livesVal.textContent = livesMax;
  localStorage.setItem('plate-lives', livesMax);
  if (!gameOver) livesCurrent = livesMax;
});

// ─── KITCHEN LAYOUT ──────────────────────────────────────────────────────────
const TOP_BAR_H = 50;   // cabinet strip at the top the plates fall from
let COUNTER_H = 0;      // counter strip at the bottom the chef stands on
let FLOOR_Y   = 0;      // top edge of the counter
let CATCH_Y   = 0;      // height of the chef's tray (catch line)

// ─── CHEF ────────────────────────────────────────────────────────────────────
const CHEF_S      = 6;    // pixel-block size
const CHEF_ROWS   = 18;   // sprite height in blocks
const TRAY_ROW    = 11;   // row (from top) where the tray sits
const TRAY_HALF_C = 7;    // tray half-width in blocks
const CATCH_REACH = TRAY_HALF_C * CHEF_S + 26;

const chef = { x: 0, targetX: 0, y: 0 };

function chefMinX() { return TRAY_HALF_C * CHEF_S + 14; }
function chefMaxX() { return W - TRAY_HALF_C * CHEF_S - 14; }

function drawChef(cx, feetY) {
  const S = CHEF_S;
  const topY = feetY - CHEF_ROWS * S;
  function seg(col, row, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(cx + col * S), Math.round(topY + row * S), w * S, h * S);
  }

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(cx, feetY + 4, 40, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  const HAT = '#FFFFFF', SKIN = '#F2C185', EYE = '#2B2B3D', CHEEK = '#FF9E9E',
        COLLAR = '#4FC3F7', APRON = '#FFFFFF', TRIM = '#FF6B6B',
        TRAY = '#C7CDD6', PANTS = '#37474F', SHOE = '#1B1B1F';

  seg(-3, 0, 6, 4, HAT);        // chef hat puff
  seg(-4, 4, 8, 1, HAT);        // hat brim
  seg(-3, 5, 6, 4, SKIN);       // head
  seg(-2, 6, 1, 1, EYE);        // left eye
  seg(1, 6, 1, 1, EYE);         // right eye
  seg(-3, 7, 1, 1, CHEEK);      // left cheek
  seg(2, 7, 1, 1, CHEEK);       // right cheek
  seg(-1, 9, 3, 1, COLLAR);     // collar
  seg(-4, 10, 9, 5, APRON);     // apron body
  seg(-4, 13, 9, 1, TRIM);      // apron trim stripe
  seg(-TRAY_HALF_C, TRAY_ROW, TRAY_HALF_C * 2 + 1, 1, TRAY); // tray (catch zone)
  seg(-TRAY_HALF_C, TRAY_ROW, 1, 1, SKIN);   // left hand
  seg(TRAY_HALF_C, TRAY_ROW, 1, 1, SKIN);    // right hand
  seg(-3, 15, 2, 2, PANTS);     // left leg
  seg(1, 15, 2, 2, PANTS);      // right leg
  seg(-3, 17, 2, 1, SHOE);      // left shoe
  seg(1, 17, 2, 1, SHOE);       // right shoe
}

// ─── RESIZE ──────────────────────────────────────────────────────────────────
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  COUNTER_H = Math.max(90, Math.min(140, H * 0.16));
  FLOOR_Y = H - COUNTER_H;
  CATCH_Y = FLOOR_Y - (CHEF_ROWS - TRAY_ROW) * CHEF_S;
  chef.y = FLOOR_Y;
  if (chef.x === 0 && chef.targetX === 0) { chef.x = chef.targetX = W / 2; }
  chef.targetX = Math.min(chefMaxX(), Math.max(chefMinX(), chef.targetX));
  chef.x       = Math.min(chefMaxX(), Math.max(chefMinX(), chef.x));
}
window.addEventListener('resize', resize);

// ─── KITCHEN BACKGROUND ──────────────────────────────────────────────────────
function drawKitchenBackground() {
  // Tiled wall
  ctx.fillStyle = '#F4E9D8';
  ctx.fillRect(0, 0, W, FLOOR_Y);
  ctx.strokeStyle = 'rgba(150,120,80,0.18)';
  ctx.lineWidth = 2;
  const TILE = 48;
  ctx.beginPath();
  for (let x = 0; x < W; x += TILE) { ctx.moveTo(x, 0); ctx.lineTo(x, FLOOR_Y); }
  for (let y = 0; y < FLOOR_Y; y += TILE) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  // Top cabinet strip — plates emerge from here
  ctx.fillStyle = '#8C5A32';
  ctx.fillRect(0, 0, W, TOP_BAR_H);
  ctx.fillStyle = '#A9713F';
  ctx.fillRect(0, 0, W, 4);
  ctx.fillStyle = '#6E4322';
  ctx.fillRect(0, TOP_BAR_H - 6, W, 6);
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 80; x < W; x += 160) { ctx.moveTo(x, 4); ctx.lineTo(x, TOP_BAR_H - 6); }
  ctx.stroke();

  // Counter the chef stands on
  ctx.fillStyle = '#B97A45';
  ctx.fillRect(0, FLOOR_Y, W, COUNTER_H);
  ctx.fillStyle = '#E0A868';
  ctx.fillRect(0, FLOOR_Y, W, 6);
  for (let x = 20; x < W - 20; x += 140) {
    ctx.fillStyle = '#8C5A32';
    ctx.fillRect(x, FLOOR_Y + 24, 110, COUNTER_H - 40);
    ctx.fillStyle = '#6E4322';
    ctx.fillRect(x + 96, FLOOR_Y + COUNTER_H / 2 - 4, 8, 8);
  }
}

// ─── PLATES ──────────────────────────────────────────────────────────────────
let plates = [];
let score  = 0;
let gameOver = false;

const PLATE_S = 4;
const PLATE_R = 6;
const PLATE_RIMS = ['#4FC3F7', '#FF6B6B', '#81C784', '#FFD54F', '#BA68C8'];

const SPAWN_MS_BASE = 1500;
let   lastSpawn      = -99999;
function spawnMs()   { return Math.max(650, SPAWN_MS_BASE - Math.min(score, 40) * 20); }
function plateSpeed() { return 2.0 + Math.min(score, 40) * 0.045; }

function makePlate() {
  const margin = 40;
  return {
    x: margin + Math.random() * (W - margin * 2),
    y: -30,
    bobX: 0,
    wobble: Math.random() * Math.PI * 2,
    rim: PLATE_RIMS[Math.floor(Math.random() * PLATE_RIMS.length)],
  };
}

function drawPlate(cx, cy, rim) {
  const S = PLATE_S, R = PLATE_R;
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + R * S + 4, R * S * 0.85, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  for (let ry = -R; ry <= R; ry++) {
    for (let rx = -R; rx <= R; rx++) {
      const d = Math.hypot(rx + 0.5, ry + 0.5);
      if (d > R) continue;
      let color;
      if (d > R - 1.3) color = rim;
      else if (d > R - 2.6) color = '#FFFFFF';
      else color = '#F1EDE4';
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(cx + rx * S), Math.round(cy + ry * S), S, S);
    }
  }

  ctx.globalAlpha = 0.5;
  ctx.fillStyle = rim;
  ctx.beginPath();
  ctx.arc(cx, cy, S * 1.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillRect(cx - R * S * 0.45, cy - R * S * 0.5, S, S);
}

const MAX_PLATES = 3;

function updatePlates(now) {
  if (plates.length < MAX_PLATES && now - lastSpawn > spawnMs()) {
    plates.push(makePlate());
    lastSpawn = now;
  }
  const spd = plateSpeed();
  for (let i = plates.length - 1; i >= 0; i--) {
    const p = plates[i];
    p.y += spd;
    p.wobble += 0.06;
    p.bobX = Math.sin(p.wobble) * 6;
    const px = p.x + p.bobX;

    if (p.y >= CATCH_Y && p.y <= FLOOR_Y && Math.abs(px - chef.x) < CATCH_REACH) {
      plates.splice(i, 1);
      score++;
      scoreEl.textContent = score;
      burst(px, p.y, ['#FFD700', '#FFEC8B', '#FFA500', '#FFFFFF']);
      popText(px, p.y - 20, ['CAUGHT!', 'NICE!', 'GOT IT!', 'TASTY!', 'YUM!'], '#FFD700');
      playCatch();
      continue;
    }
    if (p.y > FLOOR_Y) {
      plates.splice(i, 1);
      loseLife(px, FLOOR_Y, p.rim);
    }
  }
}

function drawPlates() {
  for (const p of plates) drawPlate(p.x + p.bobX, p.y, p.rim);
}

// ─── LIVES / GAME OVER ───────────────────────────────────────────────────────
let shakeTime = 0, shakeMag = 0;
let flashAlpha = 0;

function loseLife(x, y, rim) {
  livesCurrent = Math.max(0, livesCurrent - 1);
  shakeTime = 10;
  shakeMag  = 7;
  flashAlpha = 0.35;
  burst(x, y, [rim, '#FFFFFF', '#D9D9D9', '#B0B0B0']);
  popText(x, y - 10, ['OOPS!', 'CRASH!', 'OH NO!', 'SMASH!'], '#FF6B6B');
  playBreak();
  if (livesCurrent <= 0) triggerGameOver();
}

function triggerGameOver() {
  gameOver = true;
  plates = [];
  document.getElementById('final-score').textContent = score;
  document.getElementById('game-over').classList.add('open');
  playGameOver();
}

function restartGame() {
  gameOver = false;
  score = 0;
  scoreEl.textContent = 0;
  livesCurrent = livesMax;
  plates = [];
  particles = [];
  pops = [];
  document.getElementById('game-over').classList.remove('open');
  lastSpawn = performance.now();
}
document.getElementById('restart-btn').addEventListener('click', restartGame);

const HEART_S = 4;
const HEART_BITMAP = ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'];

function drawHeart(x, y, filled, s) {
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  for (let r = 0; r < HEART_BITMAP.length; r++) {
    for (let c = 0; c < HEART_BITMAP[r].length; c++) {
      if (HEART_BITMAP[r][c] !== '#') continue;
      ctx.fillRect(x + c * s + 1, y + r * s + 1, s, s);
    }
  }
  ctx.fillStyle = filled ? '#FF4757' : 'rgba(255,255,255,0.18)';
  for (let r = 0; r < HEART_BITMAP.length; r++) {
    for (let c = 0; c < HEART_BITMAP[r].length; c++) {
      if (HEART_BITMAP[r][c] !== '#') continue;
      ctx.fillRect(x + c * s, y + r * s, s, s);
    }
  }
}

function drawLivesHUD() {
  const s = HEART_S;
  const heartW = 7 * s + 6;
  const totalW = livesMax * heartW - 6;
  const startX = W / 2 - totalW / 2;
  const y = H - 6 * s - 14;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(startX - 10, y - 8, totalW + 20, 6 * s + 16);
  for (let i = 0; i < livesMax; i++) {
    drawHeart(Math.round(startX + i * heartW), Math.round(y), i < livesCurrent, s);
  }
}

// ─── PARTICLES ───────────────────────────────────────────────────────────────
let particles = [];

function burst(x, y, colors) {
  for (let i = 0; i < 14; i++) {
    const angle = (i / 14) * Math.PI * 2 + Math.random() * 0.5;
    const spd   = 2.5 + Math.random() * 4.5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd - 1,
      life: 1,
      decay: 0.02 + Math.random() * 0.02,
      color: colors[Math.floor(Math.random() * colors.length)],
      sz: 4 + (Math.floor(Math.random() * 3)) * 2,
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x  += p.vx;
    p.y  += p.vy;
    p.vy += 0.18;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.sz, p.sz);
  }
  ctx.globalAlpha = 1;
}

// ─── POP TEXT ────────────────────────────────────────────────────────────────
let pops = [];

function popText(x, y, words, color) {
  pops.push({ x, y, text: words[Math.floor(Math.random() * words.length)], life: 1, color });
}

function updatePops() {
  for (let i = pops.length - 1; i >= 0; i--) {
    pops[i].y    -= 1.8;
    pops[i].life -= 0.022;
    if (pops[i].life <= 0) pops.splice(i, 1);
  }
}

function drawPops() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = `bold 13px "Press Start 2P", monospace`;
  for (const p of pops) {
    const a = Math.max(0, p.life);
    ctx.globalAlpha = a;
    ctx.strokeStyle = '#000';
    ctx.lineWidth   = 4;
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle   = p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ─── INPUT ───────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (gameOver && (e.key === 'Enter' || e.key === ' ')) restartGame();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

const ARROW_SPEED = 14;
function applyArrowKeys() {
  if (gameOver) return;
  if (keys['ArrowLeft']  || keys['a'] || keys['A']) chef.targetX = Math.max(chefMinX(), chef.targetX - ARROW_SPEED);
  if (keys['ArrowRight'] || keys['d'] || keys['D']) chef.targetX = Math.min(chefMaxX(), chef.targetX + ARROW_SPEED);
}

function setTarget(clientX, target) {
  if (gameOver) return;
  if (target && (target.closest('.hud-btn') || target.closest('#settings-panel') || target.closest('#game-over'))) return;
  const r = canvas.getBoundingClientRect();
  chef.targetX = Math.min(chefMaxX(), Math.max(chefMinX(), clientX - r.left));
}

canvas.addEventListener('mousemove', e => setTarget(e.clientX, e.target));
canvas.addEventListener('click', e => setTarget(e.clientX, e.target));
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  setTarget(e.touches[0].clientX, e.target);
}, { passive: false });
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  setTarget(e.touches[0].clientX, e.target);
}, { passive: false });

// ─── GAME LOOP ───────────────────────────────────────────────────────────────
function loop(now) {
  ctx.fillStyle = '#0d0d2b';
  ctx.fillRect(0, 0, W, H);

  applyArrowKeys();
  chef.x += (chef.targetX - chef.x) * 0.25;

  let sx = 0, sy = 0;
  if (shakeTime > 0) {
    sx = (Math.random() - 0.5) * shakeMag;
    sy = (Math.random() - 0.5) * shakeMag;
    shakeTime--;
  }
  ctx.save();
  ctx.translate(sx, sy);

  drawKitchenBackground();
  if (!gameOver) updatePlates(now);
  drawPlates();

  updateParticles();
  drawParticles();

  drawChef(chef.x, chef.y);

  updatePops();
  drawPops();

  ctx.restore();

  if (flashAlpha > 0.01) {
    ctx.fillStyle = `rgba(255,50,50,${flashAlpha.toFixed(2)})`;
    ctx.fillRect(0, 0, W, H);
    flashAlpha *= 0.85;
  } else {
    flashAlpha = 0;
  }

  drawLivesHUD();

  requestAnimationFrame(loop);
}

// ─── INIT ────────────────────────────────────────────────────────────────────
resize();
chef.y = FLOOR_Y;
requestAnimationFrame(loop);
</script>
</body>
</html>
